name: CTRL-02 provisional T10

on:
  push:
    branches:
      - ci/ctrl-02-c73-integration

permissions:
  contents: read

jobs:
  provisional-t10:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Create test environment
        run: uv venv --python python --seed .venv

      - name: Install vLLM and vLLM-Omni
        env:
          VLLM_OMNI_TARGET_DEVICE: cpu
        run: |
          uv pip install --python .venv/bin/python "vllm==0.29.0" --torch-backend=auto
          uv pip install --python .venv/bin/python --editable .

      - name: Install focused test dependencies
        run: |
          uv pip install --python .venv/bin/python \
            "pytest==9.1.1" \
            "pytest-asyncio==1.4.0" \
            "pytest-mock==3.15.1" \
            "pytest-xdist==3.8.0" \
            "requests>=2.28.0" \
            python-multipart

      - name: Run provisional T10 scenarios
        run: |
          .venv/bin/python -m pytest \
            -c pyproject.toml \
            --confcutdir=tests/e2e/features/comfyui \
            -p no:cacheprovider \
            -vv \
            tests/e2e/features/comfyui/test_comfyui_integration.py::test_video_generation_node_minimax_h3_control_route
